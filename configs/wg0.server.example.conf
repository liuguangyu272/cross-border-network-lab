# Example ONLY: never commit a real private key or production configuration.
# Install to /etc/wireguard/wg0.conf with root:root and 0600 permissions.
# Server-side public peer key is the Windows WireGuard client's public key.
[Interface]
Address = 10.66.66.1/24
ListenPort = 51820
PrivateKey = REPLACE_LOCALLY_WITH_SERVER_PRIVATE_KEY

[Peer]
PublicKey = REPLACE_WITH_WINDOWS_CLIENT_PUBLIC_KEY
AllowedIPs = 10.66.66.2/32
